name: Mirror home-manager to Gitee
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repo
        uses: Yikun/hub-mirror-action@v1.4
        with:
          src: nix-community/home-manager
          src_endpoint: github.com
          dst: wei_hongjie/mirror-home-manager
          dst_endpoint: gitee.com
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: org
          static_list: true
          force_update: true
          clone_style: https
