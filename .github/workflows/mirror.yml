name: Git Mirror home-manager
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key for Gitee
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
      - name: Mirror git repo
        run: |
          git clone --mirror https://github.com/nix-community/home-manager.git
          cd home-manager.git
          git remote add gitee git@gitee.com:wei_hongjie/mirror-home-manager.git
          git push --mirror gitee
