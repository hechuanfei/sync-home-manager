name: Mirror home-manager to Gitee
on:
  workflow_dispatch:  # 支持手动点击触发（推荐）
  schedule:
    - cron: '0 0 * * *' # 每天UTC0点自动同步，可选
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repo
        uses: Yikun/hub-mirror-action@master
        with:
          # 源仓库 github组织/仓库名
          src: github/nix-community/home-manager
          # 目标 gitee用户名/仓库名
          dst: gitee/wei_hongjie/home-manager
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          # 源是组织仓库，account_type=org
          account_type: org
          # 可选：同步所有分支+tag
          static_branch: true
