name: Mirror home-manager to Gitee
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repo
        uses: Yikun/hub-mirror-action@v0.12
        with:
          src: github/nix-community/home-manager
          dst: gitee/wei_hongjie/mirror-home-manager
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: org
          static_list: true
          force_update: true
